schema_version = 1
id = "NetdiskModule"
kind = "host_module"
entrypoint = "app.modules.netdisk:NetdiskModule"
depends_on = []

[metadata]
name = "Netdisk"
type = "downloader"
subtype = "Netdisk"
priority = 0

[activation]
policy = "when_configured"
watch = ["Downloaders"]

[activation.selector]
kind = "system_config_item"
key = "Downloaders"
match_field = "type"
match_value = "netdisk"
enabled_field = "enabled"
