acceptance:
  - id: A1
    source: brief.md
    text: A1 凭据保活：夸克/UC 在每次取凭证前按 90 分钟窗口惰性续期；任意 API 响应带回新 Cookie
      时合并并回写数据库；鉴权失效时刷新后重试一次；刷新失败保留旧凭据，不清空账号。
    result: passed
    reason:
      text: 夸克/UC 惰性续期落地：app/application/netdisk/keepalive.py RefreshThrottle 对
        QUARK/UC 配置 5400 秒（90 分钟）窗口，_REFRESH_THROTTLE
        进程级共享，select()/require_account()/probe() 均先经
        _refresh_for_request；Set-Cookie 回写在 base.py
        _write_back_cookies（merge_cookie_header 合并、删除
        Max-Age=0），composition/netdisk.py write_back_credential 用 record.id
        定位账号回写，多账号不串号；鉴权失败 401/403 时 _dispatch_with_retry 经 _refresh_credential
        续期一次后重试（threading.local 防递归，网络错误/5xx/429 不刷新不清凭据），测试
        test_netdisk_keepalive.py 覆盖合并回写、重试一次、500 不重试。
      truncated: false
  - id: A2
    source: brief.md
    text: A2 令牌续期：光鸭使用已保存的 `refresh_token` 在临期前自动续期并写回；迅雷网页登录保存 `refresh_token`，在
      access_token 临期（JWT `exp` 前 60 秒）或 401 时续期并写回；续期失败保留旧凭据并提示重新登录。
    result: passed
    reason:
      text: 光鸭 guangya.py needs_refresh 按 expires_at 临期 60 秒判断、refresh_account 用
        refresh_token 换新 token 并写回 token/expires_at，refresh_token 为空保留旧值；迅雷
        xunlei.py jwt_expiring 按 JWT exp 前 60 秒（_JWT_LEEWAY_SECONDS=60）或 401
        重试续期，refresh_account 写回 access_token/refresh_token/expires_in；browser.py
        _xunlei_fields/_guangya_fields 均保存 refresh_token/expires；续期失败
        refresh_account 返回 None 保留旧凭据，_refresh_one 把 expired 账号归入
        NetdiskAccountFailure 并由 scheduler chain 发「请重新登录」消息。
      truncated: false
  - id: A3
    source: brief.md
    text: A3 状态恢复与启动首跑：探测返回 `unknown` 不再覆盖 `active`；重新登录或编辑凭据成功后账号状态恢复 `active`
      并重新进入可选账号池；进程启动后立即执行一次账号刷新/探测，而不是等待 6 小时。
    result: passed
    reason:
      text: db/adapters/netdiskaccount.py touch_account 中 unknown 不覆盖 active（322
        行条件守卫，测试
        test_unknown_probe_does_not_downgrade_active）；update()/paste_cookie/import_cookiecloud/password_login/confirm_qr
        更新凭据时 status='active' 恢复（accounts.py update 223 行、login.py 各登录方式带
        account_id 更新路径）；select() 只返回 active 账号；启动首跑：scheduler/catalog.py
        netdisk_account_refresh 与 netdisk_quota_refresh 均 next_run_time=now+60s
        首跑，之后 6 小时/30 分钟周期。
      truncated: false
