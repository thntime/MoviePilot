acceptance:
  - id: A1
    source: brief.md
    text: A1 迅雷昵称：迅雷网页登录检测到登录态后，「当前登录用户」显示真实昵称（优先读取页面登录态，其次凭据字段与 about
      接口），不再显示「未知」；全部来源都取不到时才显示明确回退文案。
    result: passed
    reason:
      text: browser.py:95-107 迅雷凭据脚本读取 window.$nuxt.$store.state.users.curUser 的
        nick_name/nickname 并优先作为 nickname 返回（pageNick 优先于 data.*
        各字段）；browser.py:831-833 _xunlei_fields 把非空 nickname
        写入凭据；xunlei.py:1112-1153 login_account_name 先取凭据
        nickname/nick_name/nickName/user_name/userName/name，缺失时才带 access/device
        调 /drive/v1/about，并在 data、data.user
        与响应顶层按同序匹配；取不到时返回空串由前端回退文案兜底（netdisk.qr.unknownAccount）。测试覆盖：test_netdisk_xunlei_nickname.py::test_xunlei_credential_includes_page_nickname
        验证页面昵称写入凭据，test_login_account_name_prefers_credential 验证凭据昵称优先不发请求，另有
        about 三种嵌套结构用例。Verifier 复跑 pytest tests/test_netdisk_xunlei_nickname.py
        → 12 passed, EXIT=0。
      truncated: false
  - id: A2
    source: brief.md
    text: A2
      百度弹窗：百度网页登录中，微信扫码弹窗在登录态校验通过之前不会被关闭，用户可正常扫码；校验通过后画面回到主页面，且默认只置前、不强制关闭弹窗，弹窗最终随确认或取消销毁。
    result: passed
    reason:
      text: "browser.py:712-737 poll() 只读凭据并返回 success，不再调用 _focus_main_page（diff
        确认原「if platform is BAIDU: self._focus_main_page(session)」已删除）；服务层
        login.py:349-380 仅在 validate_credential 返回 active 后通过可选端口调用
        focus_main_page(session_id)，切页失败仅记录不影响 detected；browser.py:1005
        focus_main_page 默认 close_popups=False，只 bring_to_front 并 _switch_stream
        切画面；browser.py:691-698 start() 在启动时记录 main_page 引用，:1062-1088 _main_page
        优先用该引用（校验 is_closed 与 pages 成员资格），失效时按 pan.baidu.com
        主域名回退、再取第一个非弹窗页，pages[0] 仅为最后兜底；弹窗最终随 confirm_qr/cancel_qr 的 cancel()
        关闭整个浏览器会话销毁（login.py:417、428）。测试覆盖：test_netdisk_login_popup.py 匿名 BAIDID
        下微信弹窗 0 次关闭、默认只置前、close_popups 只关微信域名、主页面引用优先、非百度
        no-op；test_netdisk_login.py 新增 detected 后调用 focus 与 login_ready
        未就绪不切页两用例。Verifier 复跑 → 45 passed（popup 12 + login/login_fixes
        33），EXIT=0。"
      truncated: false
  - id: A3
    source: brief.md
    text: A3 隔离与回归：匿名 Cookie
      不再被判定为登录完成；关闭弹窗只针对明确的微信/百度登录域名且永不关闭主页面；夸克、UC、139、迅雷、光鸭的网页登录行为与现有测试保持不变。
    result: passed
    reason:
      text: baidu.py:1238-1248 login_ready 要求 Cookie 头含 "BDUSS="（_credential_cookie 兼容
        cookie/BDUSS 形态），匿名 BAIDUID 返回 False，login.py:346-348 未就绪时返回 pending
        不判登录完成；browser.py:43-45 白名单 _AUTH_POPUP_HOSTS 仅
        open/login.weixin.qq.com，_BAIDU_AUTH_HOSTS 仅 passport/wappass.baidu.com
        且需 opener() 才视为弹窗，:1043-1050 关闭循环显式跳过
        main，主页面永不关闭；focus_main_page:1016-1018 对非 BAIDU 平台直接
        return（夸克/UC/139/光鸭/迅雷 no-op，测试 test_focus_main_page_ignores_non_baidu
        验证）。139 与 base 的 login_ready 为既有实现未改动（c139.py:655、base.py:797 在本次 diff
        之外）。Runtime 已绑定证据：39 个 tests/test_netdisk_*.py 全量 416 passed
        EXIT=0（含夸克/UC/139/光鸭/迅雷既有登录测试），改动文件 pylint 10.00；Verifier 抽查 diff
        确认改动仅触及 baidu/browser/login.py 与 3 个测试文件，与 brief 范围一致。
      truncated: false
