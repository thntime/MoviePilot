acceptance:
  - id: A1
    source: brief.md
    text: A1 登录方式可见：新增账号与编辑账号对话框在浏览器中都能看到登录方式标签（粘贴 Cookie、CookieCloud
      导入、平台支持时的账号密码/短信、网页登录），切换标签后对应表单可见并可提交。
    result: passed
    reason:
      text: NetdiskAccountDialog.vue 中 VTabs/VWindow 已是 VForm 直接子节点，无指令 <template>
        包裹已移除（并留有防回归注释）。用 @vue/compiler-sfc 独立编译该 SFC：编译零错误，渲染代码中无
        createElementVNode("template")，创建的元素仅 div/img。回归测试
        NetdiskAccountDialogTabs.spec.ts 在新增与编辑两种模式下断言登录方式标签可见且
        el.closest('template') 为 null，能捕获原生 template 包裹回归。四种登录方式（粘贴
        Cookie、CookieCloud 导入、平台支持时账号密码/短信、网页登录）由 loginMethods computed
        提供，VWindow
        各窗口对应表单与提交函数（submitCookie/submitCookieCloud/submitPassword/submitSms/confirmQrLogin）齐全。
      truncated: false
  - id: A2
    source: brief.md
    text: A2 平台默认展开：桌面与移动端的网盘平台一级菜单首次进入时全部展开，显示该平台下账号；用户仍可逐个折叠。
    result: passed
    reason:
      text: 桌面 NetdiskAccountList.vue 采用「折叠集合」反向实现：collapsedPlatforms 为空
        Set，isExpanded = 搜索时 ||
        !collapsedPlatforms.has(platform)，首次进入全部展开，togglePlatform
        可逐个折叠/再展开，搜索时强制展开匹配分组。移动端 AccountSettingNetdisk.vue 使用
        mobileCollapsedPlatforms 同一模式，NetdiskPlatformGroup 接收 expanded 并支持
        toggle，行为一致。
      truncated: false
  - id: A3
    source: brief.md
    text: A3 操作按钮位置：账号详情中「平台 / 状态 / 主账号」标签行右侧依次显示
      检测连通性、刷新令牌、设为主账号、编辑账号、删除账号；账号信息与存储空间区域不再包含这些按钮。
    result: passed
    reason:
      text: NetdiskAccountDetail.vue 标签行使用 d-flex justify-space-between：左侧为平台/状态/主账号
        VChip，右侧按钮依次为 检测连通性(probe) → 刷新令牌(refresh, 仅
        platformInfo?.supports_refresh 时渲染) → 设为主账号(setPrimary,
        account.is_primary 时 disabled) → 编辑账号(emit edit) → 删除账号(delete)，外层
        flex-wrap 支持窄屏换行。账号信息 section 与存储空间 section 内已无任何操作按钮。删除仍经
        useNetdiskAccountActions 的 createConfirm 二次确认；探测/刷新/设主的 loading
        与守卫逻辑未丢失。
      truncated: false
  - id: A4
    source: brief.md
    text: A4 凭据单行展示：已保存凭证以单行只读输入框展示（不换行、不撑高详情），保留一键复制。
    result: passed
    reason:
      text: "已保存凭据改为 readonly、density=compact、hide-details 的 VTextField（不撑高详情），scoped
        样式对 :deep(input) 设置 white-space: nowrap + overflow-x: auto +
        text-overflow: clip，单行展示可横向滚动；append-inner 槽内提供复制按钮（aria-label
        复制凭据），copyCredential 走 navigator.clipboard 并有成功/失败提示。加载中显示
        VProgressCircular，无凭据显示「无」空态。i18n 三份（zh-CN/zh-TW/en-US）的
        copyCredential、list.* 等 key 均已同步。"
      truncated: false
