name: Sync Upstream

# 每天定时把上游 v3 分支合并进来。前端仓库先跑（19:00 UTC），后端 30 分钟后跑。
# 生成物（架构基线、架构文档、version.py）自动解决；其余冲突不推送，改开 issue 列出文件。
on:
  schedule:
    - cron: '30 19 * * *' # 03:30 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: jxxghp/MoviePilot
      UPSTREAM_BRANCH: v3
      ISSUE_TITLE: 上游同步失败
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v3
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        id: fetch
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"
          behind=$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "upstream_head=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")" >> "$GITHUB_OUTPUT"
          if [ "$behind" -eq 0 ]; then
            echo "上游无新提交，跳过"
          else
            echo "上游领先 ${behind} 个提交"
          fi

      - name: Merge upstream
        id: merge
        if: steps.fetch.outputs.behind != '0'
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # .gitattributes 里登记的生成物用 ours 驱动，避免整份文件重写造成假冲突。
          git config merge.ours.driver true
          git merge --no-edit "upstream/${UPSTREAM_BRANCH}" > /tmp/merge.log 2>&1
          status=$?
          cat /tmp/merge.log
          if [ "$status" -eq 0 ]; then
            echo "conflicted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conflicts=$(git diff --name-only --diff-filter=U | sort)
          unresolved=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              # 版本号与架构文档只跟上游走，派生数字由后面的重新生成步骤修正。
              version.py | docs/architecture-overview.md)
                git checkout --theirs -- "$file"
                git add -- "$file"
                echo "已自动采用上游版本：$file"
                ;;
              *)
                unresolved="${unresolved}${file}"$'\n'
                ;;
            esac
          done <<< "$conflicts"

          if [ -z "$unresolved" ]; then
            git commit --no-edit
            echo "conflicted=false" >> "$GITHUB_OUTPUT"
            echo "冲突均为生成物，已自动解决"
            exit 0
          fi

          {
            echo "conflicts<<EOF"
            printf '%s' "$unresolved"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          git merge --abort
          echo "conflicted=true" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Set up uv
        if: steps.fetch.outputs.behind != '0' && steps.merge.outputs.conflicted == 'false'
        uses: astral-sh/setup-uv@v10.0.1

      - name: Regenerate architecture baseline
        if: steps.fetch.outputs.behind != '0' && steps.merge.outputs.conflicted == 'false'
        run: |
          set -euo pipefail
          uv sync --frozen --quiet
          uv run --frozen python scripts/architecture/baseline.py --write-host
          uv run --frozen python scripts/refresh_architecture_docs.py
          git add -A
          if git diff --cached --quiet; then
            echo "架构基线无需更新"
          else
            git commit --amend --no-edit
            echo "已把重新生成的架构基线并入合并提交"
          fi

      - name: Push merge
        if: steps.fetch.outputs.behind != '0' && steps.merge.outputs.conflicted == 'false'
        run: git push origin "HEAD:v3"

      - name: Report sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          UPSTREAM_HEAD: ${{ steps.fetch.outputs.upstream_head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${CONFLICTS:-}" ]; then
            body=$(printf '自动同步上游 `%s` 失败。\n\n- 仓库：`%s`\n- 上游提交：`%s`\n- 运行记录：%s\n\n失败发生在拉取、合并或重新生成阶段，请查看运行日志。\n' \
              "$UPSTREAM_REPO" "$GITHUB_REPOSITORY" "${UPSTREAM_HEAD:-unknown}" "$RUN_URL")
          else
            files=$(printf '%s\n' "$CONFLICTS" | sed 's/^/- `/; s/$/`/')
            body=$(printf '自动同步上游 `%s` 失败，存在合并冲突，未推送任何改动。\n\n- 仓库：`%s`\n- 上游提交：`%s`\n- 运行记录：%s\n\n**同步失败的文件：**\n\n%s\n' \
              "$UPSTREAM_REPO" "$GITHUB_REPOSITORY" "${UPSTREAM_HEAD:-unknown}" "$RUN_URL" "$files")
          fi
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq "[.[] | select(.title == \"${ISSUE_TITLE}\") | .number][0] // empty")
          if [ -n "$existing" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${existing}/comments" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" -f title="$ISSUE_TITLE" -f body="$body" > /dev/null
          fi
